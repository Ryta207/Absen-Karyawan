<!DOCTYPE html>
<html lang="id">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="theme-color"
        content="#2563eb"
    >

    <title>Absen-Karyawan</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body>

<div class="container">

    <header>

        <h1>Absen-Karyawan</h1>

        <p>
            Catatan absensi dan gaji karyawan
        </p>

    </header>


    <!-- TAMBAH KARYAWAN -->

    <div class="card">

        <h2>Tambah Karyawan</h2>

        <div class="form">

            <input
                type="text"
                id="nama"
                placeholder="Nama karyawan"
            >

            <input
                type="number"
                id="gaji"
                placeholder="Gaji per hari"
            >

            <button onclick="tambahKaryawan()">
                + Tambah Karyawan
            </button>

        </div>

    </div>


    <!-- LAPORAN -->

    <div class="card laporan-card">

        <h2>Laporan</h2>

        <button onclick="kirimSemuaWhatsApp()">
            💬 Forward Semua ke WhatsApp
        </button>

    </div>


    <!-- DATA KARYAWAN -->

    <div class="card">

        <h2>Data Karyawan</h2>

        <div class="table-container">

            <table>

                <thead>

                    <tr>

                        <th>Nama</th>

                        <th>Gaji/Hari</th>

                        <th>Senin</th>

                        <th>Selasa</th>

                        <th>Rabu</th>

                        <th>Kamis</th>

                        <th>Jumat</th>

                        <th>Sabtu</th>

                        <th>Minggu</th>

                        <th>Total Hari</th>

                        <th>Gaji Kotor</th>

                        <th>Kasbon</th>

                        <th>Gaji Bersih</th>

                        <th>Aksi</th>

                    </tr>

                </thead>


                <tbody id="dataKaryawan">

                </tbody>

            </table>

        </div>

    </div>

</div>


<script src="script.js"></script>

</body>

</html>
